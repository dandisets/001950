dateCreated: '2026-08-17T22:13:52.764766+00:00'
description: "This Dandiset contains electrophysiology and fiber photometry recordings
  of the locus coeruleus norepinephrine (LC-NE) system in mice performing a dynamic
  foraging task. Electrophysiology sessions contain single-neuron recordings from
  the LC and optogenetic tagging to identify norepinephrine neurons. Some electrophysiology
  session include antidromic stimulation to identify LC neurons projecting to the
  cortex. Some sessions additionally include high-speed video recordings of tongue
  movements and pupil tracking. Fiber photometry sessions contain recordings of LC-NE
  axonal activity in downstream target regions, including prelimbic cortex (PL), thalamus
  (TH), and cerebellum (CB), during the same dynamic foraging task.\nThe dataset was
  collected for the study *Topographic structure and function of locus coeruleus norepinephrine
  neurons*. Analysis code, including examples of how the data are loaded, processed,
  and used for analyses in the manuscript, is available in the associated GitHub repository.
  (https://github.com/AllenNeuralDynamics/aind-beh-ephys-analysis/tree/main)\n"
